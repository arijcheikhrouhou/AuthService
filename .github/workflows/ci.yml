name: CI - Build and Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Attendre SQL Server et créer la base auth_db
        run: |
          for i in $(seq 1 30); do
            docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong!Passw0rd' -Q "SELECT 1" && break
            echo "En attente de SQL Server..."
            sleep 3
          done
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong!Passw0rd' -Q "CREATE DATABASE auth_db"

      - name: Build et tests Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:sqlserver://localhost:1433;databaseName=auth_db;encrypt=true;trustServerCertificate=true
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: YourStrong!Passw0rd
          SPRING_JPA_HIBERNATE_DDL_AUTO: create
          JWT_SECRET: ci-only-secret-${{ github.run_id }}-${{ github.sha }}
        run: mvn clean verify