spring.application.name=auth-service

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=auth_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:auth_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Au moins 32 caracteres aleatoires (HMAC-SHA256)
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=3600000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}